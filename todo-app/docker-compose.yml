services:
  app:
    image: todo-front
    build:
      context: ./todo-frontend
      dockerfile: Dockerfile
    depends_on:
      - backend

  backend:
    image: todo-backend
    build:
      context: ./todo-backend
      dockerfile: Dockerfile
    environment:
      - MONGO_URL=mongodb://mongo:27017/todo-app
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongo
      - redis

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - backend

  mongo:
    image: mongodb/mongodb-community-server:7.0.45-ubi8-slim
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis
    volumes:
      - redis_data:/data

volumes:
  mongo_data:
  redis_data: